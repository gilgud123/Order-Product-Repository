spring:
  application:
    name: Product REST assignement

  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/productdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Pagination defaults
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

  # Keycloak OAuth2 Resource Server Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/product-rest-api
          jwk-set-uri: http://localhost:8081/realms/product-rest-api/protocol/openid-connect/certs

# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

# Keycloak Client Configuration (for reference)
keycloak:
  auth-server-url: http://localhost:8081
  realm: product-rest-api
  resource: product-rest-client

# Server Configuration (optional)
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Logging Configuration (optional)
logging:
  level:
    root: INFO
    com.katya.test.productrestassignement: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
    env:
      show-values: when-authorized
  info:
    env:
      enabled: true
  health:
    defaults:
      enabled: true
    db:
      enabled: true

# Application Info (shown in /actuator/info)
info:
  app:
    name: ${spring.application.name}
    description: Product REST API with Spring Boot
    version: 0.0.1-SNAPSHOT
    java:
      version: ${java.version}

